syntax = "proto3";

package vinepalma.leaf.book;

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  string format = 4;
  string file_path = 5;
  optional string cover_path = 6;
  BookMetadata metadata = 7;
  string added_at = 8;
  optional string last_read_at = 9;
}

message BookMetadata {
  optional string publisher = 1;
  optional string publish_date = 2;
  optional string language = 3;
  optional string description = 4;
  repeated string tags = 5;
  optional uint32 page_count = 6;
}

message ReadingProgress {
  string book_id = 1;
  uint32 current_page = 2;
  uint32 total_pages = 3;
  double percentage = 4;
  string last_read_at = 5;
  optional string location = 6;
  optional string cfi = 7;
}

message Bookmark {
  string id = 1;
  string book_id = 2;
  string title = 3;
  uint32 page = 4;
  string created_at = 5;
}

message Highlight {
  string id = 1;
  string book_id = 2;
  string text = 3;
  string color = 4;
  uint32 page = 5;
  HighlightPosition position = 6;
  optional string note = 7;
  string created_at = 8;
}

message HighlightPosition {
  uint32 start = 1;
  uint32 end = 2;
  optional string cfi = 3;
}
